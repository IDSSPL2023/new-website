AWSTemplateFormatVersion: "2010-09-09"
Description: Secure AI chatbot and chatbot lead capture API for the IDSSPL website.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://d1aobasss0elb9.cloudfront.net
    Description: Exact production website origin allowed to call the chatbot.

  AllowedOriginSecondary:
    Type: String
    Default: http://127.0.0.1:8080
    Description: Optional second origin used for local website testing.

  GeminiSecretArn:
    Type: String
    Description: ARN of an AWS Secrets Manager secret containing GEMINI_API_KEY.

  GeminiModel:
    Type: String
    Default: gemini-3.7-flash
    AllowedPattern: "gemini-[a-z0-9.-]+"
    Description: Gemini model supporting low thinking level, used by the IDSSPL assistant.

  LeadTableName:
    Type: String
    Default: idsspl-chatbot-leads

  RateLimitTableName:
    Type: String
    Default: idsspl-chatbot-rate-limits

Resources:
  ChatbotLeadTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref LeadTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: leadId
          AttributeType: S
      KeySchema:
        - AttributeName: leadId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: IDSSPL Website AI Advisor
        - Key: DataClassification
          Value: Customer Enquiry

  ChatbotRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref RateLimitTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: clientKey
          AttributeType: S
      KeySchema:
        - AttributeName: clientKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: IDSSPL Website AI Advisor
        - Key: DataClassification
          Value: Anonymous Rate Limit

  ChatbotFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IDSSPLChatbotRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ChatbotLeadTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ChatbotRateLimitTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GeminiSecretArn

  ChatbotFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: idsspl-ai-chatbot-api
      Description: Answers IDSSPL website questions and securely captures expert enquiries.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ChatbotFunctionRole.Arn
      MemorySize: 256
      Timeout: 45
      ReservedConcurrentExecutions: 6
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ALLOWED_ORIGIN_SECONDARY: !Ref AllowedOriginSecondary
          LEAD_TABLE: !Ref ChatbotLeadTable
          RATE_LIMIT_TABLE: !Ref ChatbotRateLimitTable
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          GEMINI_MODEL: !Ref GeminiModel
      Code:
        ZipFile: |
          import base64
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          import uuid
          import zlib
          from datetime import datetime, timezone

          import boto3
          from botocore.exceptions import ClientError

          lead_table = boto3.resource("dynamodb").Table(os.environ["LEAD_TABLE"])
          rate_table = boto3.resource("dynamodb").Table(os.environ["RATE_LIMIT_TABLE"])
          secret_client = boto3.client("secretsmanager")
          allowed_origins = {
              value.rstrip("/")
              for value in (
                  os.environ.get("ALLOWED_ORIGIN", ""),
                  os.environ.get("ALLOWED_ORIGIN_SECONDARY", ""),
              )
              if value
          }
          email_pattern = re.compile(r"^[^\s@]+@[^\s@]+\.[^\s@]+$")
          gemini_key = None

          LANGUAGE_NAMES = {
              "en": "English",
              "hi": "Hindi",
              "mr": "Marathi",
              "ta": "Tamil",
              "gu": "Gujarati",
