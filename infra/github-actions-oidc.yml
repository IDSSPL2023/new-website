AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions OIDC role for the IDSSPL website S3 deployment.

Parameters:
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to false if token.actions.githubusercontent.com is already an IAM identity provider in this AWS account.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Required only when CreateGitHubOidcProvider is false.

Conditions:
  ShouldCreateGitHubOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: idsspl-new-website

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: idsspl-new-website-github-deploy
      Description: Deploys the IDSSPL static website from GitHub Actions to S3.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: "1348509283"
                token.actions.githubusercontent.com:repository_owner_id: "301616450"
                token.actions.githubusercontent.com:environment: production
              StringLike:
                token.actions.githubusercontent.com:sub: repo:*
      Policies:
        - PolicyName: DeployStaticWebsiteToS3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDeploymentBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: arn:aws:s3:::idsspl-new-website-2026
              - Sid: ManageDeploymentObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::idsspl-new-website-2026/*
              - Sid: InvalidateCloudFrontDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/E36Z9W9XL69U9M
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: idsspl-new-website

Outputs:
  GitHubActionsDeployRoleArn:
    Description: Set this value as the AWS_DEPLOY_ROLE_ARN GitHub Actions repository variable.
    Value: !GetAtt GitHubActionsDeployRole.Arn
