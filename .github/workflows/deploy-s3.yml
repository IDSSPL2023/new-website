name: Deploy website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-s3
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: idsspl-new-website-2026
  CLOUDFRONT_DISTRIBUTION_ID: E36Z9W9XL69U9M

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        run: pnpm build
        env:
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload versioned assets
        run: >-
          aws s3 sync dist/client "s3://${S3_BUCKET}"
          --delete
          --exclude "*.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML pages
        run: >-
          aws s3 sync dist/client "s3://${S3_BUCKET}"
          --delete
          --exclude "*"
          --include "*.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"
